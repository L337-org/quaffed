name: 'Announce pull requests'

# Posts a pull request that needs action to the Slack channel named below, through the shared
# announcer, whose README says which pull requests it posts (architecture/workspace.md).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  slack:
    name: Announce to Slack
    uses: L337-org/github-workflows/.github/workflows/slack-on-pull-request.yaml@v2
    with:
      channel: '#quaffed'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
