name: 'Report failures'

# Posts a failed run of a workflow named below, started by one of the events below, to the Slack
# channel named below through the bot token in SLACK_BOT_TOKEN, by the shared reporter
# (architecture/workspace.md).  GitHub reads this trigger only from the default
# branch.
on:
  workflow_run:
    workflows:
      - 'Check inbound changes'
      - 'Code review'
      - 'Benchmarks'
      - 'Coverage'
      - 'Package'
      - 'Release'
      - 'Announce pull requests'
      - 'Record measurements'
      - 'Catch up on measurements'
    types: [completed]

permissions:
  # Both read by the shared reporter, which GitHub refuses to start without them: to name the
  # failed jobs and find a run that replaced a cancelled one, and to tell a tag from a branch.
  actions: read
  contents: read

jobs:
  slack:
    name: Report to Slack
    uses: L337-org/github-workflows/.github/workflows/slack-on-failure.yaml@v2
    with:
      channel: '#quaffed'
      # workflow_run: Record measurements runs after each merge's measuring workflows.
      events: '["schedule", "push", "release", "pull_request", "workflow_run"]'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
