name: 'Release'
permissions:
  contents: read

# Publishing a release on GitHub is the one human action that ships quaffed: this workflow then
# builds the Linux packages at the release's commit, attaches them, and checks the release
# serves them.  Pushing a tag ships nothing.  architecture/release.md has the release checklist
# and the reasoning; nothing else publishes a package.
on:
  release:
    types: [published]

# Never cancelled: a release run cut short is the one run that can leave something half
# published, and two runs for one tag must not interleave.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check out the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      # The version is resolved once, here, and every later job builds this one commit.
      - name: Read the workspace version and the release's commit
        id: check
        run: |
          {
            echo "version=$(scripts/workspace-version)"
            echo "sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"

      # The release is L337-org's, its tag is v and the workspace version, and below 1.0.0 it is
      # marked pre-release, read from the release so that ticking the flag and re-running is
      # enough.
      - name: The release is this repository's, and its tag names the workspace version
        uses: L337-org/github-workflows/actions/release-preflight@v2
        with:
          version: ${{ steps.check.outputs.version }}

  package:
    name: Package
    needs: preflight
    uses: ./.github/workflows/package.yaml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  publish:
    name: Attach the packages
    # Waits on every architecture: a build that failed for either attaches nothing.
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      # Both architectures by name, so one that did not build fails here rather than going
      # unnoticed.  A package already attached by an earlier run of this release is replaced if
      # it differs, since that run failed after attaching it; the action then reads each back
      # from the release and compares it with the build.
      - name: Attach each package to the release
        uses: L337-org/github-workflows/actions/release-attach@v2
        with:
          files: >-
            dist/quaffed_${{ needs.preflight.outputs.version }}_amd64.deb
            dist/quaffed_${{ needs.preflight.outputs.version }}_arm64.deb

  verify:
    name: The release serves both packages
    needs: [preflight, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: built

      # Read back from the release itself, not inferred from the publish job's exit status.
      - name: Each attached package is the one built, at the release's version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          assets="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[] | "\(.id) \(.name)"')"
          for arch in amd64 arm64; do
            name="quaffed_${VERSION}_${arch}.deb"
            id="$(printf '%s\n' "$assets" | awk -v n="$name" '$2 == n { print $1 }')"
            if [ -z "$id" ]; then
              echo "::error::the release does not serve $name" >&2
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id" >"$RUNNER_TEMP/$name"
            if ! cmp -s "$RUNNER_TEMP/$name" "built/$name"; then
              echo "::error::the release serves a $name that differs from the one built" >&2
              exit 1
            fi
            fields="$(dpkg-deb -f "$RUNNER_TEMP/$name" Package Version Architecture | tr '\n' ' ')"
            if [ "$fields" != "Package: quaffed Version: $VERSION Architecture: $arch " ]; then
              echo "::error::$name served by the release says: $fields" >&2
              exit 1
            fi
            echo "$name served: $fields"
          done

  # A job killed by its timeout ends as cancelled, which raises no failure notification, so a
  # release that never finished fails the run here instead.
  report-cancelled:
    name: Report a cancelled release
    needs: [preflight, package, publish, verify]
    if: always() && contains(needs.*.result, 'cancelled')
    uses: L337-org/github-workflows/.github/workflows/release-cancelled.yaml@v2
    with:
      job: preflight, package, publish or verify
