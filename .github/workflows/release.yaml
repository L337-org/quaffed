name: 'Release'
permissions:
  contents: read

# Publishing a release on GitHub is the one human action that ships quaffed: this workflow then
# builds the Linux packages at the release's commit, attaches them, and checks the release
# serves them.  Pushing a tag ships nothing.  architecture/release.md has the release checklist
# and the reasoning; nothing else publishes a package.
on:
  release:
    types: [published]

# Never cancelled: a release run cut short is the one run that can leave something half
# published, and two runs for one tag must not interleave.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check out the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      # The version is resolved once, here, and every later job builds this one commit.
      - name: Read the workspace version and the release's commit
        id: check
        run: |
          {
            echo "version=$(scripts/workspace-version)"
            echo "sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"

      - name: The release is this repository's, and its tag names the workspace version
        uses: L337-org/github-workflows/actions/release-preflight@v2
        with:
          version: ${{ steps.check.outputs.version }}

  package:
    name: Package
    needs: preflight
    uses: ./.github/workflows/package.yaml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  publish:
    name: Attach the packages
    # Waits on every architecture: a build that failed for either attaches nothing.
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      # The shared action reads each package back from the release and compares it with the
      # build, but not what the package says it is, so that is checked here, before attaching.
      - name: Each package names quaffed, the release's version and its architecture
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            name="quaffed_${VERSION}_${arch}.deb"
            if [ ! -f "dist/$name" ]; then
              echo "::error::$name was not built, so nothing is attached; the package job's output says why" >&2
              exit 1
            fi
            fields="$(dpkg-deb -f "dist/$name" Package Version Architecture | tr '\n' ' ')"
            if [ "$fields" != "Package: quaffed Version: $VERSION Architecture: $arch " ]; then
              echo "::error::$name says: $fields" >&2
              exit 1
            fi
            echo "$name: $fields"
          done

      # Both architectures by name, so one that did not build fails rather than going unnoticed.
      - name: Attach each package to the release
        uses: L337-org/github-workflows/actions/release-attach@v2
        with:
          files: >-
            dist/quaffed_${{ needs.preflight.outputs.version }}_amd64.deb
            dist/quaffed_${{ needs.preflight.outputs.version }}_arm64.deb

  # A job killed by its timeout ends as cancelled, which raises no failure notification, so a
  # release that never finished fails the run here instead.
  report-cancelled:
    name: Report a cancelled release
    needs: [preflight, package, publish]
    if: always() && contains(needs.*.result, 'cancelled')
    uses: L337-org/github-workflows/.github/workflows/release-cancelled.yaml@v2
    with:
      job: preflight, package or publish
