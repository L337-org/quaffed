name: 'Code review'
permissions:
  contents: read

# Triggers.  A full review runs when a pull request is opened, reopened or marked ready, and a
# delta review of the new commits on every push after that.  The shared workflow decides which,
# from whether an earlier review exists, and keeps the delta to the cheaper model and effort so
# that a push costs a fraction of the first review.
#
# Ask by starting a top-level PR comment with `/claude-review`, which leaves the depth to the
# shared workflow, or `/claude-review full`, each followed by a space or nothing.  A space is
# appended before matching so that `/claude-reviewer` or `/claude-review fullness` do not count.
# GitHub runs comment-triggered workflows from the default branch, so the command works only
# once this file is on `main`.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# No concurrency group here: one at workflow level is joined by every comment on the pull
# request, before the job's `if:` runs, and an unrelated comment would replace a queued review
# request.  The shared workflow queues reviews on its own job instead.

jobs:
  review:
    # Draft pull requests wait until they are ready.  A comment request is honoured on a
    # draft, because asking is the signal.  Only people the repository trusts can ask: the
    # review spends the allowance of whoever owns the token.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(format('{0} ', github.event.comment.body), '/claude-review ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: write
    uses: L337-org/github-workflows/.github/workflows/claude-review.yaml@1817a61f163af6067324e0363ac184d7a3dbce4c
    with:
      pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
      depth: ${{ (github.event_name == 'issue_comment' && startsWith(format('{0} ', github.event.comment.body), '/claude-review full ')) && 'full' || 'auto' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
