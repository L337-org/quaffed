name: 'Check inbound changes'
permissions:
  contents: read

# Triggers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every Rust job installs the toolchain from rust-toolchain.toml with `rustup toolchain install`
# and no arguments, so no version is named here (DS.2.2).  The explicit step matters: rustup
# 1.28.0 stopped installing the active toolchain implicitly, and 1.28.1 restored it only as an
# overridable default, so relying on the implicit install depends on the runner image.

# Jobs
jobs:

  repo-hygiene:
    # Conventions every repository in this organisation shares, checked by the one copy in the
    # shared workflows repository at the commit pinned here.
    runs-on: [ubuntu-latest]
    name: Repository hygiene
    # Seconds in the other repositories that carry it - a git listing, a YAML parse and regexes.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repository conventions hold
        uses: L337-org/github-workflows/actions/repo-hygiene@dc88cd55b0e0302da14685817df51e30c386631b

  action-pins:
    # Every `uses:` names a full commit SHA, checked by the shared copy pinned here.
    runs-on: [ubuntu-latest]
    name: Action pins are immutable
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every `uses:` must name a 40-hex commit SHA
        uses: L337-org/github-workflows/actions/action-pins@dc88cd55b0e0302da14685817df51e30c386631b

  fmt:
    runs-on: [ubuntu-latest]
    name: rustfmt
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Formatting is rustfmt's
        run: cargo fmt --all -- --check

  clippy:
    runs-on: [ubuntu-latest]
    name: clippy
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: No lint warnings
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    # macOS and Linux are the first targets; Windows joins this matrix when it becomes one.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Tests pass
        run: cargo test --workspace --locked
