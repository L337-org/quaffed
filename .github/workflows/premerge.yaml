name: 'Check inbound changes'
permissions:
  contents: read

# Triggers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every Rust job installs the toolchain from rust-toolchain.toml with `rustup toolchain install`
# and no arguments, so no version is named here (DS.2.2).  The explicit step matters: rustup
# 1.28.0 stopped installing the active toolchain implicitly, and 1.28.1 restored it only as an
# overridable default, so relying on the implicit install depends on the runner image.

# Jobs
jobs:

  repo-hygiene:
    # Conventions every repository in this organisation shares, checked by a script that is
    # byte-identical in each of them and verifies itself against a recorded digest.  Editing
    # this copy fails this job; divergence between copies is watched separately, on a schedule.
    runs-on: [ubuntu-latest]
    name: Repository hygiene
    # Seconds in the other repositories that carry it - a git listing, a YAML parse and regexes.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Repository conventions hold
        run: uv run --script scripts/check-repo-hygiene.py

  action-pins:
    # The same logic as the job of this name in the organisation's other repositories.
    runs-on: [ubuntu-latest]
    name: Action pins are immutable
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every `uses:` must name a 40-hex commit SHA
        run: |
          # A tag or branch ref can be repointed by the action's owner at any time, so `@v7`
          # means CI runs whatever that owner last pushed to it.  First-party actions/* are not
          # exempt (DS.6.2): Dependabot bumps the SHA and rewrites the trailing "# vX.Y.Z"
          # comment, so the pin costs nothing to hold.  Local actions (./...) are exempt - they
          # are this repository's own code at this commit.
          #
          # Quoted and upper-case SHAs are accepted because they are equally pinned, and the
          # trailing version comment is not enforced (DS.6.3): a guard that fails a legitimate
          # pin for a cosmetic reason is one somebody eventually switches off wholesale.
          bad=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows .github/actions 2>/dev/null \
                | grep -vE "uses:[[:space:]]*[\"']?\./" \
                | grep -vE "uses:[[:space:]]*[\"']?[^[:space:]\"']+@[0-9a-fA-F]{40}[\"']?([[:space:]]|\$)" \
                || true)
          if [ -n "$bad" ]; then
            echo "::error::Every action must be pinned to a full 40-hex commit SHA." >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          echo "All action references are pinned to commit SHAs."

  fmt:
    runs-on: [ubuntu-latest]
    name: rustfmt
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Formatting is rustfmt's
        run: cargo fmt --all -- --check

  clippy:
    runs-on: [ubuntu-latest]
    name: clippy
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: No lint warnings
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    # macOS and Linux are the first targets; Windows joins this matrix when it becomes one.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Tests pass
        run: cargo test --workspace --locked
