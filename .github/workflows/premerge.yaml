name: 'Check inbound changes'
permissions:
  contents: read

# Triggers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every Rust job installs the toolchain from rust-toolchain.toml with `rustup toolchain install`
# and no arguments, so no version is named here.  The explicit step matters: rustup
# 1.28.0 stopped installing the active toolchain implicitly, and 1.28.1 restored it only as an
# overridable default, so relying on the implicit install depends on the runner image.

# Jobs
jobs:

  repo-hygiene:
    # Conventions every repository in this organisation shares, checked by the one copy in the
    # shared workflows repository at the version named here.
    runs-on: [ubuntu-latest]
    name: Repository hygiene
    # A git listing, a YAML parse and regexes: no build and no network.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repository conventions hold
        uses: L337-org/github-workflows/actions/repo-hygiene@v2

  action-pins:
    # Every `uses:` names a full commit SHA, or for the shared workflows repository its
    # major-version tag, checked by the shared copy named here.
    runs-on: [ubuntu-latest]
    name: Action pin check
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every `uses:` must name a 40-hex commit SHA, or the shared workflows' major-version tag
        uses: L337-org/github-workflows/actions/action-pins@v2

  dco:
    # Every commit carries a Signed-off-by for its author (CONTRIBUTING.md, Developer
    # Certificate of Origin).  Pull requests only: the squash merge keeps every commit's message,
    # so a pull request that passes here lands on main signed off.  GitHub authors a squash commit
    # as the pull request's author, under the address that author's account chooses, which need
    # not be the address the commits were signed off with, so main's own commits would fail a
    # check against their author and are not checked here.  Merge commits, which GitHub writes,
    # are skipped.
    if: github.event_name == 'pull_request'
    runs-on: [ubuntu-latest]
    name: Commits are signed off
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every commit has its author's sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # The sign-off is matched on the author's email, ignoring case, as people type their
        # address both ways.  Dependabot is the one exception: it authors under its noreply
        # address but signs off as support@github.com, so for that author only, that sign-off
        # is the one expected; without it every dependency update would fail here.
        # The pull request's commits are those not on the base branch as fetched now, as well as
        # not at base.sha: base.sha can predate an "Update branch" merge, and main's own squash
        # commits would then be counted, and fail for the reason above.  Each step
        # is read into a variable first, so a failing git command fails the step under bash -e,
        # and a range with no commit in it fails rather than passing.
        run: |
          commits="$(git rev-list --no-merges "$HEAD" --not "$BASE" "origin/$BASE_REF")"
          dependabot='49699333+dependabot[bot]@users.noreply.github.com'
          checked=0
          unsigned=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            checked=$((checked + 1))
            email="$(git log -1 --format='%ae' "$sha")"
            expected="$email"
            if [ "$email" = "$dependabot" ]; then
              expected='support@github.com'
            fi
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qiF "<$expected>"; then
              echo "$(git log -1 --format='%h %s' "$sha"): signed off"
            else
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by <$expected> for its author" >&2
              unsigned=$((unsigned + 1))
            fi
          done <<<"$commits"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no commit on $HEAD that is not on $BASE_REF, so nothing was checked" >&2
            exit 1
          fi
          if [ "$unsigned" -ne 0 ]; then
            echo "::error::sign off every commit on the branch with git rebase --signoff $BASE_REF, then force-push (CONTRIBUTING.md)" >&2
            exit 1
          fi

  fmt:
    runs-on: [ubuntu-latest]
    name: rustfmt
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Formatting is rustfmt's
        run: cargo fmt --all -- --check

  clippy:
    runs-on: [ubuntu-latest]
    name: clippy
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: No lint warnings
        run: cargo clippy --all-targets --locked -- -D warnings

  tools:
    # Every cargo-installed tool in tools.toml builds at its pinned version.  The install is
    # cached on a hash of the manifest, so this costs a cache restore until tools.toml changes;
    # then it builds what changed, so a bad pin fails on the pull request that introduces it
    # rather than in the first job to use the tool.  Toolchains are left to the jobs that use
    # them (--cargo).
    runs-on: [ubuntu-latest]
    name: Verification tools install
    # Enough for a cold build of every cargo tool in tools.toml, with headroom.
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Install every cargo tool from tools.toml
        uses: ./.github/actions/install-tools
        with:
          tools: --cargo

      - name: Each pinned version is what was installed
        # Read back from cargo's own record of the install root, against the manifest as the
        # script parses it, so no tool is named here and none can be missed.
        # The manifest is read into a variable first, so a failing --list fails the step under
        # bash -e, and a run that checked no tool fails rather than passing.
        run: |
          record="$HOME/.quaffed-tools/.crates.toml"
          manifest="$(scripts/install-tools --list)"
          checked=0
          while read -r section name version; do
            [ "$section" = cargo-install ] || continue
            if ! grep -q "^\"$name $version " "$record"; then
              echo "::error::$name $version is not recorded in $record" >&2
              exit 1
            fi
            echo "$name $version installed"
            checked=$((checked + 1))
          done <<<"$manifest"
          if [ "$checked" -eq 0 ]; then
            echo "::error::tools.toml listed no cargo tool, so nothing was checked" >&2
            exit 1
          fi
          ls "$HOME/.quaffed-tools/bin"

  test:
    name: Test
    # macOS and Linux are the first targets; Windows joins this matrix when it becomes one.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Tests pass
        run: cargo test --workspace --locked

      - name: Install cargo-insta from tools.toml
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-insta

      # `Tests pass` is what enforces Cargo.lock: cargo insta test passes arguments after
      # `--` to the test binaries, not to cargo, so it cannot take --locked.  It reuses that
      # build, so the second run costs little.  With CI set, a new or changed snapshot fails
      # without writing a pending file, and a snapshot file no test references fails the run.
      - name: Snapshots match, and none is unreferenced
        run: cargo insta test --workspace --check --unreferenced=reject

  budgets:
    # The work the shipped build does over the synthetic corpus - instructions, peak memory, and
    # the files it opens and reads - held to budgets.toml by scripts/budgets.  Counted rather
    # than timed, so the runner's speed cannot move it; architecture/performance.md has the
    # reasoning and how to change a limit.  The runner image is named, not ubuntu-latest,
    # because Valgrind comes from it and its version moves the instruction counts.
    runs-on: [ubuntu-24.04]
    name: Budgets
    # Covers two cold builds of the package's profile - quaff, and the worsened copy for the
    # negative test - and the measurements, generously.
    timeout-minutes: 40
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Add the musl target the package is built for
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install Valgrind, strace, GNU time and the musl C toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: valgrind strace time musl-tools

      # The package's build - musl, mimalloc, the dist profile's optimisation - with its
      # symbols kept, so callgrind's report names every function.
      - name: Build quaff as the package does, with symbols
        run: cargo build --locked --profile profiling --target x86_64-unknown-linux-musl --bin quaff

      # Several runs of each scenario, judged on the worst, so the job summary shows how much the
      # counts move from run to run.
      - name: Every budget holds
        run: scripts/budgets target/x86_64-unknown-linux-musl/profiling/quaff --repeat 3

      # The guard's own negative test: a build worsened each way must fail on the budget that
      # guards it, saying so.
      - name: Show the budgets fail on a worsened build
        run: |
          worse="$(scripts/break-budgets "$RUNNER_TEMP/worse")"
          check() {
            how="$1" expected="$2"
            # These failures are expected: neither annotated as errors nor added to the job
            # summary, which report the real budgets.
            if env -u GITHUB_STEP_SUMMARY GITHUB_ACTIONS=false \
                scripts/budgets "$worse" --scenario search --env "QUAFFED_WORSEN=$how" \
                --out "$RUNNER_TEMP/worse-out" >/dev/null 2>"$RUNNER_TEMP/err"; then
              echo "::error::scripts/budgets passed a build worsened as $how"
              exit 1
            fi
            grep -F "$expected" "$RUNNER_TEMP/err" || {
              echo "::error::scripts/budgets failed on the build worsened as $how, but not with '$expected':"
              cat "$RUNNER_TEMP/err"
              exit 1
            }
          }
          check instructions "search instructions: limit"
          check memory "search peak_memory_kib: limit"
          check "read-twice:{project}/modules/statements.py" "'modules/statements.py' in the project was opened 2 times"
          check outside "'/etc/passwd', outside the project, was opened"

      # Saved whether or not the budgets held: the traces are what a reviewer reads to judge
      # whether a moved budget is still correct behaviour.
      - name: Keep the traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budgets
          path: target/budgets
          if-no-files-found: warn

  real-world-corpus:
    # The oracle - the CPython release corpus/real-world.toml names - judges both corpora.  It
    # confirms every Python file of the synthetic corpus is valid Python (scripts/check-synthetic).
    # The real-world corpus fetches, matches its pinned SHA-256, and has the oracle judge every
    # file: scripts/fetch-corpus fails on a hash mismatch, an archive
    # member that would land outside its directory, or fewer files than the floor.  The fetched
    # tree and the oracle's verdicts are cached on a hash of the manifest and the script, so
    # this costs a cache restore until either changes.  The oracle's version is read from the
    # manifest, so no Python version is named here.  Then every file of the real-world corpus is
    # parsed into an arena and printed back byte for byte, and every file the oracle refuses must
    # be refused: the round trip's ignored test in crates/python, which needs the fetched tree.
    # Last, scripts/count-structural has the oracle count each structural pattern's matches file
    # by file, and real_world_matches, another ignored test there, requires quaff's counts to
    # agree in every file.
    runs-on: [ubuntu-latest]
    name: Real-world corpus
    # Longer than scripts/fetch-corpus's download deadline plus one read's wait, with room for the
    # setup, the parse, check-synthetic, and building and running the round trip and the
    # structural counts, so a stalled download ends in the script's own error rather than a bare
    # cancellation.
    timeout-minutes: 20
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the oracle's version from the manifest
        id: oracle
        # The runner's own Python only reads the manifest; the oracle is installed next.
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('corpus/real-world.toml', 'rb'))['cpython']['oracle'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the oracle's Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.oracle.outputs.version }}

      - name: The oracle accepts every Python file of the synthetic corpus
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$PYTHON" scripts/check-synthetic'

      - name: Restore the fetched corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/corpus
          key: real-world-corpus-${{ hashFiles('corpus/real-world.toml', 'scripts/fetch-corpus') }}

      - name: Fetch, verify and judge the corpus
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$PYTHON" scripts/fetch-corpus'

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Every file round-trips, and every file the oracle refuses is refused
        # --ignored runs nothing, and passes, if the test loses its #[ignore], so the step also
        # requires that exactly one test ran.  A second ignored test in the file trips this too:
        # change the count with it.
        run: |
          set -o pipefail
          cargo test --locked -p quaffed-python --test round_trip -- --ignored --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/round-trip.log"
          if ! grep -q '^test result: ok\. 1 passed;' "$RUNNER_TEMP/round-trip.log"; then
            echo "::error::the real-world round trip did not run exactly one test" >&2
            exit 1
          fi

      - name: CPython counts the structural matches
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$PYTHON" scripts/count-structural'

      - name: Every structural match is found as CPython counts it
        # As for the round trip, the step requires that exactly one test ran.
        run: |
          set -o pipefail
          cargo test --locked -p quaffed-python --test real_world_matches -- --ignored --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/structural.log"
          if ! grep -q '^test result: ok\. 1 passed;' "$RUNNER_TEMP/structural.log"; then
            echo "::error::the structural counts did not run exactly one test" >&2
            exit 1
          fi
