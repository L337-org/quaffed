name: 'Package'
permissions:
  contents: read

# The Linux package, for both architectures, each built by scripts/build-deb on a runner of its
# own architecture.  It runs on every pull request, so a change that breaks packaging fails on
# the pull request that makes it, and release.yaml calls it at the commit the release names, so
# the package that ships is built by exactly this.  architecture/release.md has the reasoning.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'The commit to build.'
        type: string
        required: true

jobs:
  deb:
    name: Debian package (${{ matrix.arch }})
    strategy:
      # Both are built when one fails, so a run shows the state of each.  A release still needs
      # both: its publish job waits on this whole job.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Covers a cold musl build with thin LTO plus installing lintian, generously.
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release's commit when called; on a pull request, the commit under test.
          ref: ${{ inputs.ref || github.sha }}

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Install the musl C toolchain and lintian
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools lintian

      - name: Build and check the package
        run: scripts/build-deb ${{ matrix.arch }}

      # Saved whether or not the build passed: lintian's output is what explains a failed gate,
      # and the package itself is kept apart from any release so that a rescue is possible.
      - name: Keep the package and lintian's output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ matrix.arch }}
          path: |
            target/deb/*.deb
            target/deb/*.lintian.txt
          if-no-files-found: warn
