# Each ecosystem's version updates come as one pull request a week rather than one per dependency:
# separate pull requests each need a rebase and a full CI run after the one before merges, and
# a grouped one that fails is cheaper to bisect than that queue is to work through.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
        # Ruff's crates stay out and come in a group of their own: upgrading them is deliberate
        # work with its own checklist (architecture/python.md), and a Ruff release that breaks the
        # build would otherwise hold back every other update in the group.
        exclude-patterns:
          - "ruff_*"
      # Ruff's crates are released together and must move together: a pull request bumping one
      # alone builds two copies of ruff_python_ast, whose types do not mix, so it can never pass.
      ruff:
        patterns:
          - "ruff_*"

  # The clean distributions scripts/test-deb installs the package into, pinned by digest.  Only
  # the digest moves: each is a deliberate choice of release (the package install test section of
  # architecture/verification.md), so no other release is ever proposed in its place.  Minor and
  # patch are ignored as well as major, because Ubuntu's YY.MM tags make 24.04 to 24.10 a minor
  # update, which would swap a long-term release for an interim one.
  - package-ecosystem: "docker"
    directory: "/packaging/deb/install-test"
    schedule:
      interval: "weekly"
    groups:
      install-test:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows and a root action.yml only; the repository's own composite
    # actions are listed so their pins are updated too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
