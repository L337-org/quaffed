version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows and a root action.yml only; the repository's own composite
    # actions are listed so their pins are updated too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
