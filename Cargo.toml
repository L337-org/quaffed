[workspace]
resolver = "3"
members = ["crates/*"]

# The one place the version is declared (NP.7.1).  Every member inherits it with
# `version.workspace = true`, so there is nothing to keep in agreement.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/L337-org/quaffed"
authors = ["Gavin Lucas"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic from the first line rather than retrofitted, when turning it on would mean
# revisiting every file.  Individual lints are relaxed here, with a reason, not in the code.
pedantic = { level = "warn", priority = -1 }
# Off because a path or argument in a message is quoted on purpose, with `{:?}`, so that a value
# from outside the program is never interpolated bare; this lint asks for the unquoted form.
unnecessary_debug_formatting = "allow"

# What the Linux package ships: the settings its static-linking measurements were taken with.
# Kept apart from `release` so a developer's --release build stays quick to link.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
