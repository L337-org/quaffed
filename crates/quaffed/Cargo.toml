[package]
name = "quaffed"
description = "The QUAntiFied File EDitor: structural, asserted, atomic edits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Nothing is published until a release decides where and how.
publish = false

[[bin]]
name = "quaff"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "=1.49.0", features = ["filters"] }
insta-cmd = "=0.7.0"
proptest = "=1.12.0"

# The Linux package's static musl binary uses mimalloc, because musl's own allocator makes parsing
# markedly slower; see architecture/release.md.
# Every other build keeps the platform allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "=0.1.52"

[dependencies]
ignore = "=0.4.34"
memchr = "=2.8.3"
quaffed-encoding = { path = "../encoding" }
quaffed-python = { path = "../python" }
quaffed-representation = { path = "../representation" }
quaffed-script = { path = "../script" }
quaffed-syntax = { path = "../syntax" }
# Already in the graph through `ignore`'s globset; used directly to match `in` and `where` globs.
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "perf", "syntax", "meta"] }
