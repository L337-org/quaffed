[package]
name = "quaffed"
description = "The QUAntiFied File EDitor: structural, asserted, atomic edits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Nothing is published until a release decides where and how.
publish = false

[[bin]]
name = "quaff"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "=1.48.0", features = ["filters"] }
insta-cmd = "=0.7.0"

# The Linux package's static musl binary uses mimalloc, because musl's own allocator makes parsing
# markedly slower; see architecture/release.md.
# Every other build keeps the platform allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "=0.1.52"

[dependencies]
ignore = "=0.4.33"
memchr = "=2.8.3"
quaffed-encoding = { path = "../encoding" }
quaffed-representation = { path = "../representation" }
quaffed-script = { path = "../script" }
