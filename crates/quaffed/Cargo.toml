[package]
name = "quaffed"
description = "The QUAntiFied File EDitor: structural, asserted, atomic edits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Nothing is published until a release decides where and how.
publish = false

[[bin]]
name = "quaff"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "=1.48.0", features = ["filters"] }
insta-cmd = "=0.7.0"
